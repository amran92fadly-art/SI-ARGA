<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pencarian Arsip - SI-ARGA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
    font-family:Arial,sans-serif;
}

.sidebar{
    height:100vh;
    width:250px;
    position:fixed;
    background:#0d6efd;
    color:white;
    padding-top:20px;
}

.sidebar h4{
    text-align:center;
}

.sidebar a{
    display:block;
    color:white;
    padding:15px 25px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#084298;
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}
</style>
</head>

<body>

<div class="sidebar">
<h4>SI-ARGA</h4>
<p class="text-center">Arsip Digital</p>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="data_arsip.html">📁 Data Arsip</a>
<a href="upload.html">⬆ Upload Dokumen</a>
<a href="pencarian.html">🔎 Pencarian</a>
<a href="monitoring.html">📊 Monitoring</a>
<a href="profil.html">👤 Profil</a>
<a href="index.html">🚪 Logout</a>
</div>

<div class="content">
<h2>🔎 Pencarian Arsip</h2>
<p>Cari arsip berdasarkan nama dokumen.</p>
<hr>

<div class="card p-4">
<div class="mb-3">
<label class="form-label">Nama Dokumen</label>
<input type="text" id="kataKunci" class="form-control" placeholder="Masukkan nama dokumen">
</div>
<button class="btn btn-primary" onclick="cariArsip()">🔎 Cari</button>
</div>

<br>

<div class="card p-4">
<h4>Hasil Pencarian</h4>
<table class="table table-bordered">
<thead class="table-primary">
<tr>
<th>No</th>
<th>Nama</th>
<th>Jenis</th>
<th>Tahun</th>
<th>Keterangan</th>
</tr>
</thead>
<tbody id="hasilCari">
<tr>
<td colspan="5" class="text-center">Belum ada pencarian</td>
</tr>
</tbody>
</table>
</div>
</div>

<script>
let dataArsip = JSON.parse(localStorage.getItem("arsip")) || [];

function cariArsip(){
    let kata = document.getElementById("kataKunci").value.toLowerCase();
    let hasil = document.getElementById("hasilCari");
    
    if(kata.trim() === ""){
        hasil.innerHTML=`
        <tr>
            <td colspan="5" class="text-center">
                Masukkan nama dokumen terlebih dahulu
            </td>
        </tr>
        `;
        return;
    }

    hasil.innerHTML="";
    let no=1;

    dataArsip.forEach(function(item, index){
        if(item.nama.toLowerCase().includes(kata)){
            hasil.innerHTML+=`
            <tr>
                <td>${no++}</td>
                <td>
                    <a href="#" onclick="lihatArsip(${index}); return false;" class="text-primary text-decoration-none fw-bold" title="Klik untuk melihat dokumen">
                        ${item.nama} 📄
                    </a>
                </td>
                <td>${item.jenis}</td>
                <td>${item.tahun}</td>
                <td>${item.keterangan}</td>
            </tr>
            `;
        }
    });

    if(no==1){
        hasil.innerHTML=`
        <tr>
            <td colspan="5" class="text-center">
                Data tidak ditemukan
            </td>
        </tr>
        `;
    }
}

function lihatArsip(index) {
    let item = dataArsip[index];
    // Menggunakan item.link sesuai dengan struktur data arsip Anda
    if(item && item.link) {
        window.open(item.link, '_blank');
    } else {
        alert("Link dokumen tidak ditemukan atau belum di-upload!");
    }
}
</script>

</body>
</html>
