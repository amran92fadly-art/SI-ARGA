<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Arsip SI-ARGA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    font-family:Arial,sans-serif;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#0d6efd;
    position:fixed;
    color:white;
    padding-top:20px;
}

.sidebar h4{
    text-align:center;
}

.sidebar a{
    display:block;
    color:white;
    padding:15px 25px;
    text-decoration:none;
}

.sidebar a:hover{
    background:#084298;
}

.content{
    margin-left:250px;
    padding:30px;
}

.card{
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<div class="sidebar">

<h4>SI-ARGA</h4>

<p class="text-center">
Arsip Digital
</p>

<a href="dashboard.html">🏠 Dashboard</a>

<a href="data_arsip.html">📁 Data Arsip</a>

<a href="upload.html">⬆ Upload Dokumen</a>

<a href="pencarian.html">🔎 Pencarian</a>

<a href="monitoring.html">📊 Monitoring</a>

<a href="profil.html">👤 Profil</a>

<a href="index.html">🚪 Logout</a>

</div>

<div class="content">

<h2>📁 Data Arsip Laporan Kegiatan</h2>

<p>
Bidang Bina Marga - Dinas PUPR Kabupaten Kepulauan Aru
</p>

<hr>

<div class="card p-4">

<h5>Pilih Tahun Arsip</h5>

<div class="d-flex gap-2 flex-wrap">
<button class="btn btn-primary" onclick="tampilSemua('2024')">
2024
</button>

<button class="btn btn-success" onclick="tampilSemua('2025')">
2025
</button>

<button class="btn btn-warning" onclick="tampilSemua('2026')">
2026
</button>

<!-- Tombol Tambahan untuk Menampilkan Semua Arsip Sekaligus -->
<button class="btn btn-dark" onclick="tampilSemua('SEMUA')">
📁 Semua Arsip
</button>
</div>

</div>

<br>

<div class="card p-4">

<h4 id="judul">
Daftar Arsip
</h4>

<table class="table table-bordered table-hover">

<thead class="table-primary">

<tr>

<th>No</th>
<th>Nama Dokumen</th>
<th>Jenis Arsip</th>
<th>Tahun</th>
<th>Keterangan</th>
<th width="260">
Aksi
</th>

</tr>

</thead>

<tbody id="tabelArsip">

</tbody>

</table>

</div>

</div>

<script>
let dataArsip = JSON.parse(localStorage.getItem("arsip")) || [];

// Bersihkan data tahun secara otomatis jika ada titik/spasi ekstra (misal "2026." jadi "2026")
dataArsip.forEach(item => {
    if(item.tahun) {
        item.tahun = item.tahun.toString().trim().replace(/\.$/, '');
    }
});

let tabel = document.getElementById("tabelArsip");
let judul = document.getElementById("judul");

function tampilSemua(tahun){

    tabel.innerHTML = "";
    let nomor = 1;

    if (tahun === 'SEMUA') {
        judul.innerHTML = "Semua Daftar Arsip Tersimpan";
        dataArsip.forEach(function(item, index){
            tabel.innerHTML += barisTabel(nomor++, item, index);
        });
    } else {
        judul.innerHTML = "Daftar Arsip Tahun " + tahun;
        dataArsip.forEach(function(item, index){
            if(item.tahun == tahun){
                tabel.innerHTML += barisTabel(nomor++, item, index);
            }
        });
    }

    if(nomor == 1){
        tabel.innerHTML=`
        <tr>
            <td colspan="6" class="text-center">
                Belum ada arsip ${tahun === 'SEMUA' ? '' : 'tahun ' + tahun}
            </td>
        </tr>
        `;
    }
}

// Fungsi pembantu untuk membuat baris tabel agar kodenya rapi
function barisTabel(nomor, item, index) {
    return `
    <tr>
        <td>${nomor}</td>
        <td>${item.nama}</td>
        <td>${item.jenis}</td>
        <td>${item.tahun}</td>
        <td>${item.keterangan}</td>
        <td>
            <a href="${item.link || '#'}" target="_blank" class="btn btn-success btn-sm">
            👁️ Lihat
            </a>
            <button class="btn btn-warning btn-sm" onclick="editArsip(${index})">
            ✏️ Edit
            </button>
            <button class="btn btn-danger btn-sm" onclick="hapusArsip(${index})">
            🗑️ Hapus
            </button>
        </td>
    </tr>
    `;
}

function hapusArsip(index){
    let yakin = confirm("Yakin ingin menghapus arsip ini?");
    if(yakin){
        dataArsip.splice(index,1);
        localStorage.setItem("arsip", JSON.stringify(dataArsip));
        alert("Arsip berhasil dihapus.");
        tampilSemua('2025');
    }
}

function editArsip(index){
    let arsip = dataArsip[index];

    let namaBaru = prompt("Edit Nama Dokumen", arsip.nama);
    if(namaBaru===null) return;

    let jenisBaru = prompt("Edit Jenis Arsip", arsip.jenis);
    if(jenisBaru===null) return;

    let tahunBaru = prompt("Edit Tahun Arsip", arsip.tahun);
    if(tahunBaru===null) return;

    let ketBaru = prompt("Edit Keterangan", arsip.keterangan);
    if(ketBaru===null) return;

    let linkBaru = prompt("Edit Link Google Drive", arsip.link);
    if(linkBaru===null) return;

    arsip.nama = namaBaru;
    arsip.jenis = jenisBaru;
    arsip.tahun = tahunBaru.trim().replace(/\.$/, ''); // Bersihkan jika ada titik saat edit
    arsip.keterangan = ketBaru;
    arsip.link = linkBaru;

    localStorage.setItem("arsip", JSON.stringify(dataArsip));
    alert("Data berhasil diperbarui.");

    tampilSemua(arsip.tahun);
}

// Cek parameter URL jika diklik dari Total Arsip di Dashboard
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('lihat') === 'semua'){
    tampilSemua('SEMUA');
} else {
    tampil2025();
}

function tampil2024(){ tampilSemua("2024"); }
function tampil2025(){ tampilSemua("2025"); }
function tampil2026(){ tampilSemua("2026"); }
</script>

</body>
</html>
