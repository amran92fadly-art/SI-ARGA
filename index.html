<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI-ARGA | Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icon -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-box">

    <img src="logo-siarga.png" class="logo" alt="Logo SI-ARGA">

    <h2>SI-ARGA</h2>

    <h5>Sistem Informasi Arsip Bina Marga</h5>

    <p>
        Bidang Bina Marga<br>
Dinas Pekerjaan Umum dan Penataan Ruang<br>
Kabupaten Kepulauan Aru
    </p>

    <input type="email" id="email" class="form-control mb-3" placeholder="Email">

    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-primary w-100" onclick="login()">
        <i class="bi bi-box-arrow-in-right"></i>
        LOGIN
    </button>

</div>
<script src="js/login.js"></script>
</body>
</html>
