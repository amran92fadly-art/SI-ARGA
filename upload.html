<style>

body{
    background:#f4f6f9;
    font-family:Arial, sans-serif;
}


.sidebar{
    height:100vh;
    width:250px;
    position:fixed;
    background:#0d6efd;
    color:white;
    padding-top:20px;
}


.sidebar h4{
    text-align:center;
}


.sidebar a{
    display:block;
    color:white;
    padding:15px 25px;
    text-decoration:none;
}


.sidebar a:hover{
    background:#084298;
}


.content{
    margin-left:250px;
    padding:30px;
}


.card{
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}


</style>

</head>


<body>


<div class="sidebar">

<h4>

<p class="text-center">

<div class="content">


<h2>
⬆ Upload Dokumen Arsip
</h2>


<p>
Tambah laporan kegiatan Bidang Bina Marga secara digital
</p>


<hr>



<div class="card p-4">


<form>


<div class="mb-3">

<label class="form-label">
Nama Dokumen
</label>

<input type="text" id="namaDokumen" class="form-control"
placeholder="Contoh: Laporan Monitoring Jalan Tahun 2025">

</div>



<div class="mb-3">

<label class="form-label">
Jenis Arsip
</label>


<select id="jenisArsip" class="form-control">

<option>Laporan Kegiatan</option>
<option>Laporan Pengawasan</option>
<option>Dokumentasi</option>
<option>Berita Acara</option>
<option>Laporan Teknis</option>

</select>

</div>



<div class="mb-3">

<label class="form-label">
Tahun Arsip
</label>


<select id="tahunArsip" class="form-control">

<option>2024</option>
<option>2025</option>
<option>2026</option>

</select>


</div>



<div class="mb-3">

<label class="form-label">
Keterangan
</label>


<textarea id="keterangan" class="form-control"
rows="3"
placeholder="Masukkan keterangan dokumen">
</textarea>


</div>




<div class="mb-3">

<label class="form-label">
Link Google Drive
</label>


<input
    type="text"
    id="linkDrive"
    class="form-control"
    placeholder="Tempel link Google Drive di sini">


</div>



<button type="button" class="btn btn-primary" onclick="simpanArsip()">

💾 Simpan Arsip

</button>



</form>


</div>


</div>

<script src="js/app.js"></script>
<script src="js/arsip.js"></script>
</body>
